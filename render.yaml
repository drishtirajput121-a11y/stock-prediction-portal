# Render Infrastructure-as-Code Blueprint
# https://render.com/docs/blueprint-spec

services:
  # ── Django REST Backend ──────────────────────────────
  - type: web
    name: market-vision-api
    runtime: python
    region: oregon
    rootDir: backend-drf
    buildCommand: "./build.sh"
    startCommand: "gunicorn stock_prediction_main.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        sync: false   # Set manually after frontend deploys
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: RENDER_EXTERNAL_HOSTNAME
        fromService:
          name: market-vision-api
          type: web
          property: host

  # ── React Vite Frontend ──────────────────────────────
  - type: web
    name: market-vision-frontend
    runtime: static
    rootDir: frontend-react
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_BACKEND_BASE_API
        sync: false   # Set to https://market-vision-api.onrender.com/api/v1/
